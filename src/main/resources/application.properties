spring.application.name=YuvoRideBackend
server.port=${SERVER_PORT:8080}

# Database (credentials come from environment)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yuvoride}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# JWT — set JWT_SECRET to a long random value in every environment
app.jwt.secret=${JWT_SECRET:change-me-dev-only-use-a-long-random-secret-key-of-at-least-256-bits}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# OTP
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.max-sends-per-hour=${OTP_MAX_SENDS_PER_HOUR:5}
app.otp.length=6

# Google
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.maps-api-key=${GOOGLE_MAPS_API_KEY:}

# CORS — comma-separated origins for mobile/dev clients
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:19006,http://localhost:3000}

# Local file storage (swap for S3 via FileStorageService)
app.storage.local-dir=${FILE_STORAGE_DIR:uploads}
app.storage.public-base-url=${FILE_PUBLIC_BASE_URL:http://localhost:8080/files}

app.currency=INR
app.driver-match.radius-km=${DRIVER_MATCH_RADIUS_KM:10}
app.driver-match.request-ttl-seconds=${DRIVER_REQUEST_TTL_SECONDS:120}

app.admin.phone=${ADMIN_PHONE:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.name=${ADMIN_NAME:YuvoRide Admin}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
